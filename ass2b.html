<!DOCTYPE html>
<html ng-app="inventoryApp">
<head>
    <title>Advanced Warehouse Portal</title>
    <!-- TIP: If this local path fails, use: https://googleapis.com -->
    <script src="E:\msl\angular.min.js"></script>
    
    <style>
        :root { --primary: #1e293b; --accent: #4f46e5; --danger: #ef4444; --success: #22c55e; --bg: #f8fafc; }
        body { background: var(--bg); font-family: 'Segoe UI', sans-serif; margin: 0; padding: 20px; color: #334155; }
        .wrapper { max-width: 1100px; margin: 0 auto; }
        
        
        .card { background: #fff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); margin-bottom: 20px; border: 1px solid #e2e8f0; }
        .header-flex { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        h2 { margin: 0; font-size: 1.1rem; color: var(--primary); display: flex; align-items: center; gap: 10px; }
        
       
        .form-grid { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr auto; gap: 12px; align-items: end; }
        .input-group { display: flex; flex-direction: column; gap: 5px; }
        label { font-size: 12px; font-weight: 600; color: #64748b; }
        input { padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; }
        input:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1); }
        
        
        .btn { padding: 10px 20px; border-radius: 6px; border: none; font-weight: 600; cursor: pointer; transition: 0.2s; }
        .btn-add { background: var(--accent); color: white; }
        .btn-add:hover { background: #4338ca; }
        .btn-del { background: #fee2e2; color: var(--danger); padding: 5px 10px; font-size: 12px; }
        .btn-del:hover { background: var(--danger); color: white; }

       
        .table-container { background: white; border-radius: 12px; border: 1px solid #e2e8f0; overflow: hidden; }
        table { width: 100%; border-collapse: collapse; }
        th { background: #f1f5f9; padding: 12px 15px; text-align: left; font-size: 12px; color: #475569; }
        td { padding: 12px 15px; border-top: 1px solid #f1f5f9; font-size: 14px; }
        
       
        .badge { padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; }
        .status-low { background: #fef2f2; color: #dc2626; border: 1px solid #fecaca; }
        .status-ok { background: #f0fdf4; color: #16a34a; border: 1px solid #bbf7d0; }
        
        .search-bar { width: 250px; padding: 8px; border-radius: 20px; border: 1px solid #cbd5e1; padding-left: 15px; }
    </style>
</head>
<body ng-controller="InventoryController">

    <div class="wrapper">
        <!-- Input Section -->
        <div class="card">
            <div class="header-flex">
                <h2>📦 NEW STOCK ENTRY</h2>
                <input type="text" class="search-bar" ng-model="searchText" placeholder="🔍 Search inventory...">
            </div>
            
            <div class="form-grid">
                <div class="input-group">
                    <label>SKU CODE</label>
                    <input type="text" ng-model="newItem.sku" placeholder="Ex: LAP-01">
                </div>
                <div class="input-group">
                    <label>PRODUCT NAME</label>
                    <input type="text" ng-model="newItem.name" placeholder="Ex: Wireless Mouse">
                </div>
                <div class="input-group">
                    <label>QUANTITY</label>
                    <input type="number" ng-model="newItem.qty" placeholder="0">
                </div>
                <div class="input-group">
                    <label>RECEIVE DATE</label>
                    <input type="date" ng-model="newItem.receivedDate">
                </div>
                <button class="btn btn-add" ng-click="addItem()">Add to Inventory</button>
            </div>
        </div>

        <!-- Display Section -->
        <div class="table-container">
            <table ng-if="inventory.length > 0">
                <thead>
                    <tr>
                        <th>SKU</th>
                        <th>PRODUCT DESCRIPTION</th>
                        <th>STOCK STATUS</th>
                        <th>QTY</th>
                        <th>ARRIVAL DATE</th>
                        <th>ACTION</th>
                    </tr>
                </thead>
                <tbody>
                    <tr ng-repeat="item in inventory | filter:searchText | orderBy:'-receivedDate'">
                        <td><strong>{{ item.sku | uppercase }}</strong></td>
                        <td>{{ item.name }}</td>
                        <td>
                            <span class="badge" ng-class="item.qty < 10 ? 'status-low' : 'status-ok'">
                                {{ item.qty < 10 ? 'RE-ORDER' : 'IN STOCK' }}
                            </span>
                        </td>
                        <td>{{ item.qty }} units</td>
                        <td>{{ item.receivedDate | date:'mediumDate' }}</td>
                        <td>
                            <button class="btn btn-del" ng-click="removeItem($index)">Remove</button>
                        </td>
                    </tr>
                </tbody>
            </table>
            
            <div style="text-align:center; padding:60px; color:#94a3b8;" ng-if="inventory.length === 0">
                <p>No inventory records found. Add stock to begin.</p>
            </div>
        </div>
    </div>

    <script>
        var app = angular.module('inventoryApp', []);

        app.controller('InventoryController', function($scope) {
            // Initial Data
            $scope.inventory = [
                { sku: 'OFF-40', name: 'Desk Chairs', qty: 5, receivedDate: new Date() }
            ];
            
            $scope.newItem = { receivedDate: new Date() };

           
            $scope.addItem = function() {
                if($scope.newItem.sku && $scope.newItem.name) {
                    $scope.inventory.push(angular.copy($scope.newItem));
                    $scope.newItem = { receivedDate: new Date() }; // Reset
                } else {
                    alert("Missing Info: Please enter SKU and Product Name");
                }
            };

          
            $scope.removeItem = function(index) {
                if(confirm("Are you sure you want to remove this item?")) {
                    $scope.inventory.splice(index, 1);
                }
            };
        });
    </script>
</body>
</html>
